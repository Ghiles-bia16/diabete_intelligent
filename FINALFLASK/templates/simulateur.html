<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur - Diabète Intelligent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/simulateur.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><img src="{{ url_for('static', filename='img/diabetes.png') }}" alt="Logo" id="logo"></li>
                <li><a href="{{ url_for('accueil') }}">ACCUEIL</a></li>
                <li><a href="{{ url_for('simulateur') }}">PRESTATION</a></li>
                <li><a href="#">CONTACT</a></li>
                <li><img src="{{ url_for('static', filename='img/france.png') }}" alt="Drapeau" id="drapeau"> FR</li>
            </ul>
        </nav>
    </header>
    <main>
        <p> PREDICTION ></p>
        <div class="container">
            <div class="form-background">
                <form method="POST" action="{{ url_for('simulateur') }}">
                    <h4>Vos informations</h4>
                    
                    <div class="allignement">
                        <div>
                            <label for="age">AGE</label>
                            <input type="number" id="age" name="age" required>
                        </div>
                        <div>
                            <label for="bmi">BMI</label>
                            <input type="float" id="bmi" name="bmi" min="0" required>
                        </div>
                    </div>
        
                    <div class="allignement">
                        <div>
                            <label for="hypertension">HYPERTENSION</label>
                            <input type="number" id="hypertension" name="hypertension" min="0" max="1" required>
                        </div>
                        <div>
                            <label for="heart_disease">MALADIE CARDIAQUE</label>
                            <input type="number" id="heart_disease" name="heart_disease" min="0" max="1" required>
                        </div>
                    </div>
        
                    <div class="allignement">
                        <div>
                            <label for="HbA1c_level">HbA1c LEVEL</label>
                            <input type="float" id="HbA1c_level" name="HbA1c_level" required>
                        </div>
                    </div>
        
                    <div class="allignement">
                        <div>
                            <label for="blood_glucose_level">NIVEAU DE GLYCÉMIE</label>
                            <input type="number" id="blood_glucose_level" name="blood_glucose_level" required>
                        </div>
                    </div>
        
                    <div class="last-row">
                        <div>
                            <label for="gender">SEXE</label>
                            <select id="gender" name="gender" required>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                            </select>
                        </div>
                        <div>
                            <label for="smoking_history">HISTORIQUE TABAC</label>
                            <select id="smoking_history" name="smoking_history" required>
                                <option value="No Info">No Info</option>
                                <option value="current">Current</option>
                                <option value="ever">Ever</option>
                                <option value="former">Former</option>
                                <option value="never">Never</option>
                                <option value="not current">Not Current</option>
                            </select>
                        </div>
                    </div>
        
                    <div class="submit-button">
                        <input type="submit" value="SIMULER">
                    </div>
                </form>
                {% if prediction is not none %}
                    <h3>Prediction Result: {{ prediction }}</h3>
                {% endif %}
            </div>
        </div>
    </main>
    <footer>
        <p>© 2024 Diabète Intelligent</p>
    </footer>
</body>
</html>
