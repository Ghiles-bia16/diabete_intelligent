<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Diabète Intelligent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .chat-container {
            width: 600px;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display:flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #D9D9D9;
            color: rgb(0, 0, 0);
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        .chat-input input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        .chat-input button {
            padding: 10px 20px;
            border: none;
            background-color: #D9D9D9;
            color: rgb(0, 0, 0);
            border-radius: 5px;
            cursor: pointer;
        }
        .chat-input button:hover {
            background-color: #686868;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .message.bot {
            background-color: #f1f1f1;
            align-self: flex-start;
        }
        .message.user {
            background-color: #b2b2b2;
            color: rgb(3, 3, 3);
            align-self: flex-end;
        }
    </style>
</head>
<body>
<header>
  <nav>
    <ul>
      <li><img src="{{ url_for('static', filename='img/diabetes.png') }}" alt="" id="logo"></li>
      <li><a href="{{ url_for('accueil') }}">ACCUEIL</a></li>
      <li><a href="{{ url_for('simulateur') }}">PRESTATION</a></li>
      <li><a href="{{url_for('FAQ')}}">FAQ</a></li>
    <li><a href="">CONTACT</a></li>
    <li><img src="{{ url_for('static', filename='img/france.png') }}" alt="" id="drapeau" >  FR</li>
    </ul>
    </nav>
</header>

    <div class="main-content">
        <div class="Blur-effect"></div>
        <div class="chat-container">
            <div class="chat-header">
                Assistant Diabète Intelligent
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome message -->
                <div class="message bot">
                    Bonjour! Je suis votre assistant virtuel. Comment puis-je vous aider avec vos questions sur le diabète?
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Tapez votre message...">
                <button onclick="sendMessage()">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const userInput = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');

            if (userInput.value.trim() !== '') {
                const userMessage = document.createElement('div');
                userMessage.classList.add('message', 'user');
                userMessage.textContent = userInput.value;
                chatMessages.appendChild(userMessage);

                fetch('/FAQ', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: userInput.value }),
                })
                .then(response => response.json())
                .then(data => {
                    const botMessage = document.createElement('div');
                    botMessage.classList.add('message', 'bot');
                    botMessage.textContent = data.response;
                    chatMessages.appendChild(botMessage);

                    chatMessages.scrollTop = chatMessages.scrollHeight;
                })
                .catch(error => {
                    console.error('Error:', error);
                    const errorMessage = document.createElement('div');
                    errorMessage.classList.add('message', 'bot');
                    errorMessage.textContent = "Désolé, une erreur s'est produite.";
                    chatMessages.appendChild(errorMessage);
                });

                userInput.value = '';
            }
        }

        // Add Enter key support
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
