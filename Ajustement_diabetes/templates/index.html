<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Prediction Form</title>
</head>
<body>
    <h2>Health Prediction Form</h2>
    <form method="POST" action="/">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <label for="hypertension">Hypertension (0: No, 1: Yes):</label>
        <input type="number" id="hypertension" name="hypertension" min="0" max="1" required><br><br>

        <label for="heart_disease">Heart Disease (0: No, 1: Yes):</label>
        <input type="number" id="heart_disease" name="heart_disease" min="0" max="1" required><br><br>

        <label for="bmi">BMI:</label>
        <input type="float" id="bmi" name="bmi" required><br><br>

        <label for="HbA1c_level">HbA1c Level:</label>
        <input type="float" id="HbA1c_level" name="HbA1c_level"  required><br><br>

        <label for="blood_glucose_level">Blood Glucose Level:</label>
        <input type="number" id="blood_glucose_level" name="blood_glucose_level"  required><br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select><br><br>

        <label for="smoking_history">Smoking History:</label>
        <select id="smoking_history" name="smoking_history" required>
            <option value="No Info">No Info</option>
            <option value="current">Current</option>
            <option value="ever">Ever</option>
            <option value="former">Former</option>
            <option value="never">Never</option>
            <option value="not current">Not Current</option>
        </select><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
        <h3>Prediction Result: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
